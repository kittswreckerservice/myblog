<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Community Blog Feed</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            color: #333;
        }
        .blog-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .blog-header {
            text-align: center;
            margin-bottom: 30px;
        }
        /* Secret Admin Trigger Title Elements */
        .secret-title {
            cursor: default;
            user-select: none;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .btn {
            background: #0076ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .btn:hover { background: #005bc5; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            margin-top: 10px;
            border: none;
            color: white;
            cursor: pointer;
        }
        .btn-danger:hover { background: #bd2130; }
        
        /* Post Window Form Styling */
        .form-window {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; }
        .form-group input[type="text"], .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group textarea { height: 150px; resize: vertical; }
        
        /* Blog List Feed Box Layout */
        .blog-posts-list { display: flex; flex-direction: column; gap: 25px; }
        .post-card-wrapper {
            position: relative;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 25px;
        }
        .post-card { cursor: pointer; }
        .post-title { margin-top: 0; color: #111; }
        .post-meta { font-size: 0.85rem; color: #777; margin-bottom: 15px; }
        .post-thumbnail {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 15px;
        }

        /* Single Post Full View Screen Layout */
        .back-button {
            display: inline-block;
            background: #222;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .full-post-content { background: #ffffff; padding: 40px; border-radius: 8px; }
        .full-post-image { width: 100%; max-height: 500px; object-fit: contain; margin-bottom: 20px; border-radius: 6px; }
        .hidden { display: none !important; }
        .admin-banner {
            background: #fff3cd;
            color: #856404;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="blog-container">
        
        <!-- Blog Main Page View Section -->
        <div id="blog-main-view">
            <div id="admin-indicator" class="admin-banner hidden">
                🛠️ Admin Mode Active (You can delete any post)
            </div>
            
            <div class="blog-header">
                <!-- Click this H1 text title 5 times in a row to unlock deleting options -->
                <h1 class="secret-title" onclick="trackAdminClicks()">Community Blog Feed</h1>
                <p>Share your stories, thoughts, and pictures globally!</p>
            </div>

            <div class="action-bar">
                <button class="btn" onclick="togglePostWindow()">✍️ Create New Post</button>
            </div>

            <!-- Typing Post Modal Window -->
            <div id="post-window" class="form-window hidden">
                <h3 style="margin-top:0;">Write a New Global Post</h3>
                <form id="blog-form" onsubmit="savePost(event)">
                    <div class="form-group">
                        <label for="author">Your Name</label>
                        <input type="text" id="author" required placeholder="Anonymous or your handle">
                    </div>
                    <div class="form-group">
                        <label for="title">Post Title</label>
                        <input type="text" id="title" required placeholder="Give your post a title">
                    </div>
                    <div class="form-group">
                        <label for="image-upload">Upload a Picture</label>
                        <input type="file" id="image-upload" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="content">What's on your mind?</label>
                        <textarea id="content" required placeholder="Type your text content here..."></textarea>
                    </div>
                    <div style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button type="button" class="btn btn-secondary" onclick="togglePostWindow()">Cancel</button>
                        <button type="submit" id="submit-btn" class="btn">Publish Post</button>
                    </div>
                </form>
            </div>

            <div id="posts-container" class="blog-posts-list">
                <p style="text-align: center; color: #777;">Loading global feed...</p>
            </div>
        </div>

        <!-- Single Full Post Target Container (Hidden by default) -->
        <div id="blog-single-view" class="hidden">
            <span class="back-button" onclick="showMainView()">&larr; Back to Feed</span>
            <article class="full-post-content">
                <h1 id="full-title"></h1>
                <div class="post-meta" id="full-meta"></div>
                <img id="full-image" class="full-post-image hidden" src="" alt="Post image">
                <div id="full-body"></div>
            </article>
        </div>

    </div>

    <!-- Firebase System Module Architecture SDK CDN Links -->

        // Fire Up Core Firebase Modules
        const app = initializeApp(firebaseConfig);

        let blogPosts = [];

        // Hidden Administration Multi-Click Routine Setup
        let clickCount = 0;
        window.trackAdminClicks = function() {
            clickCount++;
            if (clickCount >= 5) {
                isAdmin = !isAdmin;
                clickCount = 0;
                document.getElementById('admin-indicator').classList.toggle('hidden', !isAdmin);
                renderBlogPosts();
                alert(isAdmin ? "Admin mode unlocked! Delete controls are now active." : "Admin mode closed.");
            }
        }

        // Real-Time Sync Pipeline Hook (Index-Free Sorting Logic)
        const collectionRef = collection(db, "posts");
        onSnapshot(collectionRef, (snapshot) => {
            blogPosts = [];
            snapshot.forEach((doc) => {
                blogPosts.push({ id: doc.id, ...doc.data() });
            });
            
            // Native UI engine array timeline arrangement mechanism
            blogPosts.sort((a, b) => b.timestamp - a.timestamp);
            
            renderBlogPosts();
        }, (error) => {
            console.error("Firebase Operational Engine Error Details:", error);
            alert("CRITICAL FIREBASE RUNTIME ERROR:\n" + error.message);
            document.getElementById('posts-container').innerHTML = 
                `<p style="text-align: center; color: red; font-weight: bold;">
                    Database Error Hook: ${error.message}<br>
                    Please make sure your Firebase Firestore Rules allow read/write actions.
                 </p>`;
        });

        window.togglePostWindow = function() {
            document.getElementById('post-window').classList.toggle('hidden');
        }
